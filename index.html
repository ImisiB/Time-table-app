<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Time-table</title>
</head>
<body>
  <div class="modal-div">
    <div class="modal">
      <p>Subject: <input type="text" class="modal-input"></p>
      <p>Teacher: <input type="text" class="modal-input2"></p>
      <p>
      <button class="save-button">Save</button>
      <button class="cancel-button">Cancel</button></p>
    </div>
  </div>
  <div class="clearModal-div">
    <div class="clearModal">
      <p>Are you sure you want to clear your timetable</p>
      <button class="yesButton">Yes</button>
      <button class="noButton">No</button>
    </div>
  </div>
    <h1 class="header">TIMETABLE</h1>
    <table>
      <tbody>
        <tr>
          <th class="time">TIME</th>
          <th class="day">MONDAY</th>
          <th class="day">TUESDAY</th>
          <th class="day">WEDNESDAY</th>
          <th class="day">THURSDAY</th>
          <th class="day">FRIDAY</th>
          <th class="day">SATURDAY</th>
          <th class="day">SUNDAY</th>
        <th><button class="clear">Clear all</button></th>
        </tr>

    </tbody>
    </table>
  </div>
  <script src="script.js"></script>
</body>
</html>
